services:
  app:
    build: .
    image: hcc-platform:0.2.0
    restart: on-failure:3
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      APP_ENV: production
      APP_MANAGED: "true"
      APP_SECRETS_DIR: /run/secrets
      APP_FIRST_ADMIN_LOGIN: ${HCC_OPERATOR_LOGIN:-operator}
      APP_DATA_DIR: /data
      DATABASE_URL: sqlite:////data/hackathon.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${HCC_DATA_DIR:-./data}:/data
      - ${HCC_RUNTIME_DIR:?Use start.bat/start.sh or set HCC_RUNTIME_DIR to a protected secret directory}:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:size=768m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
